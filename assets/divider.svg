<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 3" width="1000" height="3" role="img" aria-label="">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24283b" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#3d59a1" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#24283b" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="scan" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dcfff" stop-opacity="0.95"/>
