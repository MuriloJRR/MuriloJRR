<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Murilo Felipe — Analise de Sistemas, Implantacao de ERP, Dados">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="0.6" stop-color="#1d1e2b"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>

    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="560" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.45" stop-color="#7dcfff"/>
      <stop offset="0.75" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7aa2f7"/>
      <animate attributeName="x1" values="-440;60;-440" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="60;560;60" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dcfff" stop-opacity="1"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
      <animate attributeName="x1" values="-300;1000;-300" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1300;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3d59a1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3d59a1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2a2e42" stroke-width="1"/>
    </pattern>

    <clipPath id="type">
      <rect x="62" y="150" width="330" height="26">
        <animate attributeName="width" values="0;0;330;330" keyTimes="0;0.12;0.62;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="210" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="210" fill="url(#bg)"/>
    <rect width="1000" height="210" fill="url(#grid)" opacity="0.5"/>

    <ellipse cx="860" cy="24" rx="300" ry="150" fill="url(#glow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="120" cy="200" rx="240" ry="120" fill="url(#glow)" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.22;0.5" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <g fill="#7aa2f7">
      <circle cx="905" cy="150" r="2.5" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="930" cy="150" r="2.5" fill="#7dcfff" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3.2s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="955" cy="150" r="2.5" fill="#bb9af7" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.85;0.3" dur="3.2s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="40" y="52" width="4" height="96" rx="2" fill="#7aa2f7">
      <animate attributeName="height" values="0;96" dur="1.1s" fill="freeze"/>
    </rect>

    <text x="62" y="92" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="700"
          letter-spacing="1.5" fill="url(#sweep)">MURILO FELIPE
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>

    <text x="63" y="122" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5"
          letter-spacing="2.2" fill="#7aa2f7" opacity="0.95">Análise de Sistemas · Implantação de ERP · Dados
      <animate attributeName="opacity" values="0;0.95" dur="1.9s" fill="freeze"/>
    </text>

    <text x="42" y="169" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#565f89">&#8250;</text>
    <g clip-path="url(#type)">
      <text x="62" y="169" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#9aa5ce">em transição para desenvolvimento</text>
    </g>
    <rect x="396" y="155" width="8" height="17" fill="#7dcfff">
      <animate attributeName="x" values="64;64;396;396" keyTimes="0;0.12;0.62;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="205" width="1000" height="2" fill="#24283b"/>
    <rect x="0" y="205" width="1000" height="2" fill="url(#rule)"/>
  </g>
</svg>
